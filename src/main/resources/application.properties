spring.application.name=minimarket-pro
# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite
spring.datasource.url=jdbc:sqlite:minimarket.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Registro de actividad
logging.level.root=WARN
logging.level.com.ejemplo.crudpersona=INFO
logging.level.org.hibernate.SQL=WARN

# Datos de prueba: 100 categorias, 100 productos, 100 personas y 250 ventas.
# Es seguro dejarlo activo (no duplica registros); ponlo en false para desactivarlo.
app.seeder.enabled=true

# Datos del emisor impresos en comprobantes PDF y reportes Excel
app.empresa.razon-social=MINIMARKET PRO (DEMO)
app.empresa.nombre-comercial=MiniMarket Pro
app.empresa.ruc=00000000000
app.empresa.direccion=Juliaca, Puno (demo)
app.empresa.telefono=
app.empresa.email=
